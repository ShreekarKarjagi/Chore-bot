services:
  - type: web
    name: house-chore-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TEXTBELT_API_KEY
        sync: false
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: SEED_SECRET
        sync: false
      - key: TEST_MODE
        sync: false
      - key: TEST_NUMBER
        sync: false
      - key: PERSON_1_NAME
        sync: false
      - key: PERSON_1_NUMBER
        sync: false
      - key: PERSON_2_NAME
        sync: false
      - key: PERSON_2_NUMBER
        sync: false
      - key: PERSON_3_NAME
        sync: false
      - key: PERSON_3_NUMBER
        sync: false
