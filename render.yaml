services:
  - type: web
    name: house-chore-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: PERSON_1_NAME
        sync: false
      - key: PERSON_1_NUMBER
        sync: false
      - key: PERSON_2_NAME
        sync: false
      - key: PERSON_2_NUMBER
        sync: false
      - key: PERSON_3_NAME
        sync: false
      - key: PERSON_3_NUMBER
        sync: false
